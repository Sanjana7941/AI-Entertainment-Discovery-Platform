<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch History – CineMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.gstatic.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div id="navbar-container"></div>

  <main style="padding: 40px 0 80px;">
    <div class="container" style="max-width: 960px;">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 32px; flex-wrap: wrap; gap: 16px;">
        <div>
          <h1 style="font-size: 2.4rem; margin-bottom: 6px;">Watch <span class="text-gradient">History</span></h1>
          <p style="color: var(--text-muted); font-size: 0.95rem;">
            Your chronological viewing activity powering CineMind AI's taste graph.
          </p>
        </div>

        <div style="display: flex; gap: 12px; align-items: center;">
          <span id="history-count" class="badge badge-primary" style="font-size: 0.88rem; padding: 6px 14px;">Loading...</span>
          <button id="clear-all-history-btn" class="btn btn-outline btn-sm" style="color: var(--danger); border-color: rgba(239,68,68,0.3);">
            Clear History
          </button>
        </div>
      </div>

      <!-- TIMELINE LIST -->
      <div id="history-timeline">
        <!-- Populated by history.js -->
      </div>
    </div>
  </main>

  <!-- Confirm Clear History Modal -->
  <div id="clear-history-modal" class="modal-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">Clear Watch History?</h3>
        <button class="modal-close-btn" onclick="closeModal('clear-history-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--text-secondary); line-height: 1.6;">
          Are you sure you want to clear your entire watch history? This action cannot be undone and will reset your viewing pattern similarity scores in the recommendation engine.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('clear-history-modal')">Cancel</button>
        <button id="confirm-clear-history" class="btn btn-danger">Yes, Clear History</button>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
