<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – CineMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div id="navbar-container"></div>

  <main style="display: flex; align-items: center; justify-content: center; padding: 60px 16px;">
    <div style="background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="font-size: 2.5rem; margin-bottom: 8px;">🔐</div>
        <h2 style="font-size: 1.8rem; margin-bottom: 6px;">Reset Password</h2>
        <p style="font-size: 0.88rem; color: var(--text-muted);">
          Enter your registered email address to receive password recovery instructions.
        </p>
      </div>

      <form id="forgot-password-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Account Email</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="e.g. demo@cinemind.ai" required />
        </div>

        <button type="submit" id="forgot-submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px;">
          Send Reset Instructions
        </button>
      </form>

      <div id="forgot-result-msg" style="display: none; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: var(--radius-md); padding: 14px; margin-top: 20px; font-size: 0.85rem; color: var(--success); line-height: 1.4;"></div>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem;">
        Remember your password? <a href="/login.html" style="color: var(--accent-primary); font-weight: 600;">Return to Sign In</a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value.trim();
      const btn = document.getElementById('forgot-submit-btn');
      const msgBox = document.getElementById('forgot-result-msg');

      btn.disabled = true;
      btn.textContent = 'Processing...';

      try {
        const res = await window.api.post('/auth/forgot-password', { email });
        msgBox.style.display = 'block';
        msgBox.textContent = res.message;
        window.showToast('Instructions generated!', 'success');
      } catch (err) {
        window.showToast(err.message || 'Error processing request.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Instructions';
      }
    });
  </script>
</body>
</html>
