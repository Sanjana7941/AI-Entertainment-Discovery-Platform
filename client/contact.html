<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact & Support – CineMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div id="navbar-container"></div>

  <main style="padding: 60px 16px;">
    <div class="container" style="max-width: 720px;">
      <div style="background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 40px; box-shadow: var(--shadow-lg);">
        <div style="text-align: center; margin-bottom: 32px;">
          <div style="font-size: 2.5rem; margin-bottom: 8px;">📬</div>
          <h2 style="font-size: 2rem; margin-bottom: 8px;">Get in Touch</h2>
          <p style="font-size: 0.95rem; color: var(--text-muted);">
            Have feedback, feature ideas, or entertainment requests for CineMind AI? We'd love to hear from you.
          </p>
        </div>

        <form id="contact-form">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label" for="contact-name">Your Name</label>
              <input type="text" id="contact-name" class="form-input" placeholder="e.g. Alex" required />
            </div>
            <div class="form-group">
              <label class="form-label" for="contact-email">Your Email</label>
              <input type="email" id="contact-email" class="form-input" placeholder="e.g. alex@example.com" required />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="contact-subject">Inquiry Type</label>
            <select id="contact-subject" class="form-select">
              <option value="General">General Inquiry</option>
              <option value="Feedback">Platform Feedback</option>
              <option value="Suggestion">Entertainment Catalog Suggestion</option>
              <option value="Bug">Bug or Technical Issue</option>
              <option value="Partnership">API & Partnerships</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="contact-message">Message</label>
            <textarea id="contact-message" class="form-textarea" placeholder="Write your comments or questions here..." required rows="5"></textarea>
          </div>

          <button type="submit" id="contact-submit-btn" class="btn btn-primary btn-lg" style="width: 100%;">
            Send Message 🚀
          </button>
        </form>

        <div id="contact-success-box" style="display: none; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-radius: var(--radius-md); padding: 20px; margin-top: 24px; text-align: center;">
          <div style="font-size: 2rem; margin-bottom: 8px;">🎉</div>
          <h4 style="color: var(--success); margin-bottom: 4px;">Thank you for contacting CineMind AI!</h4>
          <p style="font-size: 0.9rem; color: var(--text-secondary); margin: 0;">Our engineering and curation team will review your message shortly.</p>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const btn = document.getElementById('contact-submit-btn');
      const box = document.getElementById('contact-success-box');

      btn.disabled = true;
      btn.textContent = 'Sending...';

      setTimeout(() => {
        btn.style.display = 'none';
        box.style.display = 'block';
        window.showToast('Message sent successfully!', 'success');
      }, 700);
    });
  </script>
</body>
</html>
