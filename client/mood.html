<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Explorer – CineMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div id="navbar-container"></div>

  <main style="padding: 40px 0 80px;">
    <div class="container">
      <div style="text-align: center; max-width: 760px; margin: 0 auto 40px;">
        <span class="badge badge-cyan" style="margin-bottom: 8px;">Emotional Intelligence Engine</span>
        <h1 style="font-size: 2.6rem; margin-bottom: 8px;">What are you feeling <span class="text-gradient">today?</span></h1>
        <p style="color: var(--text-muted); font-size: 1.05rem;">
          Select your vibe or state of mind. CineMind AI dynamically maps your mood to tempo, genre affinity, and thematic intensity.
        </p>
      </div>

      <!-- 10 INTERACTIVE MOOD SELECTOR GRID -->
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 48px;" id="mood-buttons-grid">
        <!-- Populated by mood.js -->
      </div>

      <!-- ACTIVE MOOD EXPLANATION BANNER -->
      <div id="mood-active-banner"></div>

      <!-- MOOD RECOMMENDATIONS RESULTS -->
      <div class="section-header">
        <div>
          <h2 class="section-title">✨ Curated for Your Vibe</h2>
          <p class="section-subtitle">Specially matched entertainment to elevate, mirror, or soothe your feelings</p>
        </div>
      </div>

      <div class="content-grid" id="mood-results-grid">
        <!-- Populated by mood.js -->
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/mood.js"></script>
</body>
</html>
